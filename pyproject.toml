[project]
name = "ai-stock-analysis"
dynamic = ["version"]
description = "Multi-agent AI stock analysis system"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.59",
    "yfinance>=0.2.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pandas>=2.0",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
stock-analysis = "stock_analysis.main:cli"
stock-fetch = "stock_analysis.fetch:cli"
stock-analysis-backtest = "stock_analysis.backtest.main:cli"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/stock_analysis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_analysis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Selected explicitly rather than relying on ruff's defaults: the default rule
# set shifts between ruff releases, so an unpinned gate reports a different
# number of problems on every upgrade and stops being a gate.
[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "ISC",  # implicit string concat — catches missing commas in list literals
    "RUF",
]
ignore = [
    # Naive dates and datetimes are deliberate: market data is dated by trading
    # day, and attaching timezones would imply a precision the sources lack.
    "DTZ",
    # Long prompt strings are more readable unwrapped than split.
    "E501",
    # `class Signal(str, Enum)` must NOT become `StrEnum`: `str(Signal.BUY)`
    # returns "Signal.BUY" under the former and "buy" under the latter, and
    # `Briefing.coerce_signal_values` plus every persisted briefing.json depend
    # on the current behaviour.
    "UP042",
    # Chinese text and em dashes in prose are intentional, not homoglyph typos.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures use class-level dict literals as fake API payloads.
"tests/**" = ["RUF012"]
