name: Refresh Momentum Allocation

on:
  schedule:
    # 01:15 UTC = 09:15 MYT, after US close in both EST and EDT.
    # Also run weekends so a calendar-month rollover is ready before Monday.
    # The price request excludes the current UTC date.
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: momentum-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install price-only dependencies
        run: python -m pip install pandas pydantic yfinance "exchange-calendars>=4.11,<5"
      - name: Download prices and calculate fixed-rule allocations
        env:
          PYTHONPATH: src
        run: python scripts/refresh_momentum_dashboard.py
      - name: Commit only the validated public snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/data/momentum.json web/data/momentum.sha256
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: refresh price-only momentum allocation"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          exit 1
