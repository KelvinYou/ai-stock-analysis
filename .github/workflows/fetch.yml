name: Daily Market Data Fetch

on:
  schedule:
    # One run per trading day, Tue–Sat 00:30 UTC: after the US close in both
    # EDT (20:00 UTC) and EST (21:00 UTC), and long after Bursa (09:00 UTC).
    # Each run re-requests the newest stored bar, so a later revision of the
    # close is picked up the next day.
    - cron: '30 0 * * 2-6'
    # 1st of the month 02:00 UTC: full resync backstop. A split or dividend
    # already forces a full refetch for that ticker (has_adjustments_since);
    # this catches lookups that failed. It used to run weekly and rewrote every
    # adjusted bar of every ticker, which was most of the repository's growth.
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      full:
        description: Force full history refetch (skip incremental append)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    concurrency:
      group: fetch
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv pip install --system -e .

      - name: Fetch market data
        id: fetch
        env:
          SCHEDULE: ${{ github.event.schedule }}
          FULL_INPUT: ${{ github.event.inputs.full }}
        run: |
          set -euo pipefail
          FLAGS=""
          if [ "$SCHEDULE" = "0 2 1 * *" ] || [ "$FULL_INPUT" = "true" ]; then
            FLAGS="--full"
          fi
          stock-fetch --from-file tickers.txt --workers 8 $FLAGS -v

      # Reports, never blocks: a stale briefing needs an LLM pipeline rerun,
      # which this workflow deliberately does not do. The point is that the
      # run's own summary says so instead of the data looking healthy.
      - name: Audit data health
        if: always() && steps.fetch.outcome != 'cancelled'
        run: |
          python scripts/audit_data_health.py | tee /tmp/data-health.txt || true
          {
            echo "## Data health"
            echo
            echo '```'
            cat /tmp/data-health.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated data
        if: always() && steps.fetch.outcome != 'cancelled'
        env:
          OK: ${{ steps.fetch.outputs.success_count }}
          TOTAL: ${{ steps.fetch.outputs.total_count }}
          STALE: ${{ steps.fetch.outputs.stale_count }}
          NEWEST_BAR: ${{ steps.fetch.outputs.newest_bar_date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          COUNTS=""
          if [ -n "${OK:-}" ] && [ -n "${TOTAL:-}" ]; then
            COUNTS=" (${OK}/${TOTAL} ok"
            if [ -n "${STALE:-}" ] && [ "${STALE}" != "0" ]; then
              COUNTS="${COUNTS}, ${STALE} stale"
            fi
            COUNTS="${COUNTS})"
          fi
          # Date the commit by the newest bar actually written, not by the
          # wall clock: "fetch 2026-09-09" on a CSV whose last bar is 09-08 is
          # how a lagging feed reads as a healthy run.
          AS_OF="${NEWEST_BAR:-}"
          if [ -z "$AS_OF" ]; then
            AS_OF="$(date -u +%Y-%m-%d) (no bars)"
          fi
          git commit -m "data: fetch ${AS_OF}${COUNTS}"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "push attempt $i failed, retrying in $((i * 5))s..."
            sleep $((i * 5))
          done
          echo "ERR: push failed after 3 attempts" >&2
          exit 1
