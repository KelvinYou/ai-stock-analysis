name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint Python
        run: ruff check src tests scripts

      - name: Run Python tests
        run: pytest -q

      - name: Verify OpenAPI snapshot
        run: python scripts/generate_openapi.py --check

      - name: Verify Postman collection
        run: python scripts/generate_postman.py --check

      - name: Verify architecture documentation
        run: python scripts/sync_architecture.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Verify pipeline layout and rendered graph
        working-directory: web
        run: npm run check:pipeline

      - name: Build web in offline filesystem mode
        working-directory: web
        env:
          STOCK_ANALYSIS_API_URL: ""
          STOCK_ANALYSIS_API_TOKEN: ""
          SUPABASE_URL: ""
          SUPABASE_PUBLISHABLE_KEY: ""
        run: npm run build

      - name: Build deployment image
        run: docker build -t ai-stock-analysis:ci .

  database-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: stock_contract_test
          POSTGRES_PASSWORD: contract-test-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: stock_contract_test
      PGPASSWORD: contract-test-only
    steps:
      - uses: actions/checkout@v4
      - name: Initialize disposable Supabase roles and apply migrations
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role bypassrls;"
          for migration in supabase/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: Verify immutable inputs, privileges and stage binding
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/run_input_contract.sql
