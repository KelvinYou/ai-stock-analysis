name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint Python
        run: ruff check src tests

      - name: Run Python tests
        run: pytest -q

      - name: Verify OpenAPI snapshot
        run: python scripts/generate_openapi.py --check

      - name: Verify Postman collection
        run: python scripts/generate_postman.py --check

      - name: Verify architecture documentation
        run: python scripts/sync_architecture.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Build web in offline filesystem mode
        working-directory: web
        env:
          STOCK_ANALYSIS_API_URL: ""
          STOCK_ANALYSIS_API_TOKEN: ""
          SUPABASE_URL: ""
          SUPABASE_PUBLISHABLE_KEY: ""
        run: npm run build

      - name: Build deployment image
        run: docker build -t ai-stock-analysis:ci .
