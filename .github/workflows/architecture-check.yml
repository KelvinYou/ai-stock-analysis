name: Architecture Sync Check

on:
  pull_request:
    paths:
      - pipeline.json
      - architecture.md
      - scripts/sync_architecture.py
  push:
    branches: [main]
    paths:
      - pipeline.json
      - architecture.md
      - scripts/sync_architecture.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check architecture documentation is synchronized
        run: python scripts/sync_architecture.py --check
