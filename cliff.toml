# git-cliff configuration: generates CHANGELOG.md and GitHub release notes
# from conventional commits. Release process: docs/development.md#releases.
#
# Data refreshes (`data:`), merges and submodule/CI chores carry no code change
# and are skipped, so the scheduled fetch commits never reach the changelog.

[changelog]
header = """
# Changelog

All notable changes to this project are recorded here. Versions follow
[Semantic Versioning](https://semver.org/) as defined for this repository in
[docs/development.md](docs/development.md#releases); every release states
whether its results are comparable with the previous version.
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{% endfor -%}
{% endfor %}
"""
trim = false
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
  { message = "^data", skip = true },
  { message = "^fetch", skip = true },
  { message = "^[Mm]erge", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(submodule\\)", skip = true },
  { message = "^ci", skip = true },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Changed" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { body = ".*BREAKING", group = "<!-- 5 -->Breaking" },
  { message = "^(chore|build|test|style)", group = "<!-- 6 -->Maintenance" },
]
