<svg viewBox="0 0 1002 1388" role="img" aria-labelledby="pipeline-title pipeline-desc" class="h-auto w-full min-w-[560px]"><style>svg{font-family:Arial}.fill-background{fill:#f1f2f4}.fill-card{fill:white}.fill-secondary,.fill-muted{fill:#e8eaee}.fill-ink{fill:#13151b}.fill-graphite{fill:#62676f}.fill-bull{fill:#207950}.fill-bear{fill:#b6312b}.stroke-rule{stroke:#e0e2e6}.stroke-ink{stroke:#13151b}.stroke-graphite{stroke:#62676f}.stroke-bull{stroke:#207950}.stroke-bear{stroke:#b6312b}.font-semibold{font-weight:600}</style><rect width="100%" height="100%" fill="white"/><title id="pipeline-title">Four-layer analysis pipeline, data ingestion through briefing</title><desc id="pipeline-desc">Layer 1 (Data Ingestion): Ticker universes, US market data, Bursa / KLSE, Historical replay, Analysis Store. Layer 2 (Analyst Agents, Haiku): Fundamentals, Sentiment, Technical, Macro / FX. Layer 3 (Adversarial Debate, Opus): Bull researcher, Bear researcher. Layer 3.5 (Research Manager, Sonnet): ResearchManager. Supporting context (Outcome Memory): Outcome Memory. Layer 4 (Synthesis, Sonnet): SynthesizerAgent, Consensus + actionability, RiskChecker. Output: Briefing, consumed by Next.js screener, FastAPI, Backtester.</desc><defs><marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 z" class="fill-graphite"></path></marker></defs><g><rect x="14" y="14" width="872" height="293" rx="4" class="fill-secondary stroke-rule" stroke-width="1"></rect><rect x="14" y="18" width="3" height="285" rx="1.5" class="fill-graphite" style="opacity:0.15"></rect><text x="24" y="31" font-size="11" class="fill-ink font-semibold">Layer 1<tspan class="fill-graphite font-normal"> · Data Ingestion</tspan><tspan class="fill-graphite font-normal"> — Deterministic inputs — no LLM</tspan></text></g><g><rect x="14" y="347" width="872" height="95" rx="4" class="fill-secondary stroke-rule" stroke-width="1"></rect><rect x="14" y="351" width="3" height="87" rx="1.5" class="fill-graphite" style="opacity:0.25"></rect><text x="24" y="364" font-size="11" class="fill-ink font-semibold">Layer 2<tspan class="fill-graphite font-normal"> · Analyst Agents</tspan><tspan class="fill-graphite font-normal"> — four concurrent analysts</tspan></text><g><title>config.py · quick_think_model</title><rect x="832" y="355" width="44" height="14" rx="4" class="fill-background stroke-rule" stroke-width="1"></rect><text x="854" y="365" text-anchor="middle" font-size="10" class="num fill-graphite font-medium">Haiku</text></g></g><g><rect x="14" y="482" width="872" height="83" rx="4" class="fill-secondary stroke-rule" stroke-width="1"></rect><rect x="14" y="486" width="3" height="75" rx="1.5" class="fill-graphite" style="opacity:0.35"></rect><text x="24" y="499" font-size="11" class="fill-ink font-semibold">Layer 3<tspan class="fill-graphite font-normal"> · Adversarial Debate</tspan><tspan class="fill-graphite font-normal"> — 3 rounds by default</tspan></text><g><title>config.py · deep_think_model</title><rect x="838" y="490" width="38" height="14" rx="4" class="fill-background stroke-rule" stroke-width="1"></rect><text x="857" y="500" text-anchor="middle" font-size="10" class="num fill-graphite font-medium">Opus</text></g></g><g><rect x="14" y="605" width="872" height="107" rx="4" class="fill-secondary stroke-rule" stroke-width="1"></rect><rect x="14" y="609" width="3" height="99" rx="1.5" class="fill-graphite" style="opacity:0.45000000000000007"></rect><text x="24" y="622" font-size="11" class="fill-ink font-semibold">Layer 3.5<tspan class="fill-graphite font-normal"> · Research Manager</tspan><tspan class="fill-graphite font-normal"> — optional adjudication</tspan></text><g><title>config.py · research_manager_model</title><rect x="826" y="613" width="50" height="14" rx="4" class="fill-background stroke-rule" stroke-width="1"></rect><text x="851" y="623" text-anchor="middle" font-size="10" class="num fill-graphite font-medium">Sonnet</text></g></g><g><rect x="14" y="752" width="872" height="107" rx="4" class="fill-secondary stroke-rule" stroke-width="1"></rect><rect x="14" y="756" width="3" height="99" rx="1.5" class="fill-graphite" style="opacity:0.55"></rect><text x="24" y="769" font-size="11" class="fill-ink font-semibold">Supporting context<tspan class="fill-graphite font-normal"> · Outcome Memory</tspan><tspan class="fill-graphite font-normal"> — optional · resolved exits only</tspan></text></g><g><rect x="14" y="899" width="872" height="281" rx="4" class="fill-secondary stroke-rule" stroke-width="1"></rect><rect x="14" y="903" width="3" height="273" rx="1.5" class="fill-graphite" style="opacity:0.65"></rect><text x="24" y="916" font-size="11" class="fill-ink font-semibold">Layer 4<tspan class="fill-graphite font-normal"> · Synthesis</tspan><tspan class="fill-graphite font-normal"> — synthesis then deterministic risk</tspan></text><g><title>config.py · synthesis_model</title><rect x="826" y="907" width="50" height="14" rx="4" class="fill-background stroke-rule" stroke-width="1"></rect><text x="851" y="917" text-anchor="middle" font-size="10" class="num fill-graphite font-medium">Sonnet</text></g></g><path data-edge-from="UNI" data-edge-to="US" d="M450,97 L450,106 Q450,112 444,112 L234,112 Q228,112 228,118 L228,127" fill="none" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)" class="stroke-graphite"></path><path data-edge-from="UNI" data-edge-to="MY" d="M450,97 L450,127" fill="none" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)" class="stroke-graphite"></path><path data-edge-from="US" data-edge-to="SDL" d="M228,196 L228,205 Q228,211 234,211 L444,211 Q450,211 450,217 L450,226" fill="none" stroke-width="1.5" marker-end="url(#arrow)" class="stroke-graphite"></path><path data-edge-from="MY" data-edge-to="SDL" d="M450,196 L450,226" fill="none" stroke-width="1.5" marker-end="url(#arrow)" class="stroke-graphite"></path><path data-edge-from="REPLAY"